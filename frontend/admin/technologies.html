<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kelola Teknologi — NAHNU Admin</title>
  <link rel="icon" type="image/png" href="/logo-primary.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">
  <link rel="stylesheet" href="/src/css/style.css">
</head>
<body class="bg-[#0d0f14] text-slate-200 min-h-screen flex selection:bg-[#ff6b00] selection:text-white">
  <div id="admin-sidebar-container"></div>

  <main class="flex-1 ml-64 p-8 overflow-y-auto min-h-screen bg-[#0d0f14]">
    <div class="max-w-5xl mx-auto space-y-6">
      <div class="flex items-center justify-between pb-6 border-b border-white/[0.08]">
        <div>
          <h1 class="text-2xl font-extrabold text-white tracking-tight">Teknologi & Stack</h1>
          <p class="text-xs text-slate-400 mt-1">Daftar teknologi, framework, dan tools yang dikuasai oleh tim.</p>
        </div>
        <button id="add-tech-btn" class="px-4 py-2.5 rounded-xl bg-gradient-to-r from-[#ff6b00] to-[#ff7a18] hover:from-[#ff7a18] hover:to-[#ff8a2e] text-white font-bold text-xs flex items-center gap-2 shadow-lg shadow-[#ff6b00]/25 transition-all uppercase tracking-wider">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
          <span>Tambah Teknologi</span>
        </button>
      </div>

      <div class="glass-card rounded-2xl overflow-hidden border border-white/[0.08]">
        <table class="w-full text-left text-xs">
          <thead class="bg-[#12141c] text-slate-300 uppercase tracking-wider font-bold border-b border-white/[0.08]">
            <tr>
              <th class="p-4">Icon</th>
              <th class="p-4">Nama Teknologi</th>
              <th class="p-4">Slug URL</th>
              <th class="p-4">Jumlah Project</th>
              <th class="p-4 text-right">Aksi</th>
            </tr>
          </thead>
          <tbody id="tech-table-body" class="divide-y divide-white/[0.06]">
            <tr><td colspan="5" class="p-8 text-center text-slate-400">Memuat data teknologi...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Modal Add/Edit -->
  <div id="tech-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-xs">
    <div class="bg-[#151722] p-6 sm:p-7 rounded-3xl w-full max-w-md border border-white/[0.08] shadow-2xl text-slate-200">
      <h3 id="modal-title" class="text-base font-bold text-white mb-4">Tambah Teknologi Baru</h3>
      <form id="tech-form" class="space-y-4">
        <input type="hidden" id="tech-id">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1" for="tech-name">Nama Teknologi *</label>
          <input type="text" id="tech-name" required placeholder="Contoh: React, Docker, Redis" class="w-full bg-[#11131c] border border-white/[0.1] rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-[#ff6b00]">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1" for="tech-slug">Slug (Opsional / Otomatis)</label>
          <input type="text" id="tech-slug" class="w-full bg-[#11131c] border border-white/[0.1] rounded-xl px-3 py-2 text-xs text-white font-mono focus:outline-none focus:border-[#ff6b00]">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1" for="tech-icon">Devicon Class / Icon</label>
          <input type="text" id="tech-icon" placeholder="Contoh: devicon-react-original colored" class="w-full bg-[#11131c] border border-white/[0.1] rounded-xl px-3 py-2 text-xs text-white font-mono focus:outline-none focus:border-[#ff6b00]">
          <span class="text-[10px] text-slate-400 block mt-1">Menggunakan format class Devicons (opsional).</span>
        </div>
        <div class="flex items-center justify-end gap-2 pt-3 border-t border-white/[0.08]">
          <button type="button" id="close-modal-btn" class="px-4 py-2 rounded-xl text-xs font-bold text-slate-400 hover:text-white transition-colors">Batal</button>
          <button type="submit" class="px-5 py-2 rounded-xl bg-gradient-to-r from-[#ff6b00] to-[#ff7a18] hover:from-[#ff7a18] hover:to-[#ff8a2e] text-white font-bold text-xs uppercase tracking-wider shadow-md shadow-[#ff6b00]/25 transition-all">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="/src/js/admin-technologies.js"></script>
</body>
</html>
