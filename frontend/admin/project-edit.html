<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Project — NAHNU Admin</title>
  <link rel="icon" type="image/png" href="/logo-primary.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css">
  <link rel="stylesheet" href="/src/css/style.css">
</head>
<body class="bg-[#0d0f14] text-slate-200 min-h-screen flex selection:bg-[#ff6b00] selection:text-white">
  <div id="admin-sidebar-container"></div>

  <main class="flex-1 ml-64 p-8 overflow-y-auto min-h-screen bg-[#0d0f14]">
    <div class="max-w-4xl mx-auto space-y-6">
      <!-- Header -->
      <div class="flex items-center justify-between pb-6 border-b border-white/[0.08]">
        <div>
          <a href="/admin/projects.html" class="inline-flex items-center gap-1.5 text-xs font-bold text-slate-400 hover:text-[#ff6b00] mb-2 transition-colors">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            <span>Kembali ke Daftar Project</span>
          </a>
          <h1 class="text-2xl font-extrabold text-white tracking-tight">Edit Project</h1>
        </div>
      </div>

      <!-- Form Card -->
      <div class="glass-card p-8 rounded-3xl border border-white/[0.08] shadow-2xl">
        <form id="project-form" class="space-y-6">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            <!-- Title -->
            <div class="sm:col-span-2">
              <label class="block text-xs font-semibold text-slate-300 mb-2" for="title">Judul Project *</label>
              <input 
                type="text" 
                id="title" 
                required 
                class="w-full bg-[#11131c] border border-white/[0.1] rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-[#ff6b00]"
              >
            </div>

            <!-- Slug -->
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-2" for="slug">Slug URL *</label>
              <input 
                type="text" 
                id="slug" 
                required
                class="w-full bg-[#11131c] border border-white/[0.1] rounded-xl px-4 py-3 text-xs text-white font-mono focus:outline-none focus:border-[#ff6b00]"
              >
            </div>

            <!-- Category -->
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-2" for="category_id">Kategori *</label>
              <select 
                id="category_id" 
                class="w-full bg-[#11131c] border border-white/[0.1] rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-[#ff6b00]"
              >
                <option value="">Pilih Kategori</option>
              </select>
            </div>

            <!-- Status -->
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-2" for="status">Status Publikasi *</label>
              <select 
                id="status" 
                class="w-full bg-[#11131c] border border-white/[0.1] rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-[#ff6b00]"
              >
                <option value="published">Published</option>
                <option value="draft">Draft</option>
              </select>
            </div>

            <!-- Short Description -->
            <div class="sm:col-span-2">
              <label class="block text-xs font-semibold text-slate-300 mb-2" for="short_description">Ringkasan Singkat (Lead excerpt)</label>
              <textarea 
                id="short_description" 
                rows="2" 
                class="w-full bg-[#11131c] border border-white/[0.1] rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-[#ff6b00] resize-none"
              ></textarea>
            </div>

            <!-- Demo URL -->
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-2" for="demo_url">Link Live Demo</label>
              <input 
                type="url" 
                id="demo_url" 
                class="w-full bg-[#11131c] border border-white/[0.1] rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-[#ff6b00]"
              >
            </div>

            <!-- Repo URL -->
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-2" for="repository_url">Link GitHub / Repository</label>
              <input 
                type="url" 
                id="repository_url" 
                class="w-full bg-[#11131c] border border-white/[0.1] rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-[#ff6b00]"
              >
            </div>
          </div>

          <!-- Cover Image Upload -->
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-2">Cover Media (Pilih file baru untuk mengganti)</label>
            <div class="flex items-center gap-6">
              <div id="cover-preview-box" class="w-32 h-20 rounded-xl bg-[#11131c] border border-dashed border-white/20 flex items-center justify-center text-slate-500 text-xs overflow-hidden">
                No image
              </div>
              <input type="file" id="cover" accept="image/*" class="text-xs text-slate-400 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-[#ff6b00] file:text-white hover:file:bg-[#ff7a18]">
            </div>
          </div>

          <!-- Technologies Tagger -->
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-2">Pilih Teknologi yang Digunakan</label>
            <div id="tech-checkbox-list" class="grid grid-cols-2 sm:grid-cols-3 gap-2 p-3 rounded-xl bg-[#11131c] border border-white/[0.08] max-h-40 overflow-y-auto"></div>
          </div>

          <!-- Team Members Tagger -->
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-2">Developer Terlibat *</label>
            <div id="team-checkbox-list" class="grid grid-cols-1 sm:grid-cols-3 gap-2 p-3 rounded-xl bg-[#11131c] border border-white/[0.08]"></div>
          </div>

          <!-- Quill Rich Text Editor -->
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-2">Deskripsi Lengkap Project (Quill Editor)</label>
            <div class="rounded-xl overflow-hidden shadow-xs">
              <div id="quill-editor" class="min-h-[220px]"></div>
            </div>
          </div>

          <div class="pt-4 border-t border-white/[0.08] flex items-center justify-end gap-3">
            <a href="/admin/projects.html" class="px-5 py-2.5 rounded-xl text-xs font-bold text-slate-400 hover:text-white transition-colors">Batal</a>
            <button 
              type="submit" 
              id="save-btn" 
              class="px-6 py-2.5 rounded-xl bg-gradient-to-r from-[#ff6b00] to-[#ff7a18] hover:from-[#ff7a18] hover:to-[#ff8a2e] text-white font-bold text-xs uppercase tracking-wider shadow-lg shadow-[#ff6b00]/25 transition-all flex items-center gap-2"
            >
              <span>Perbarui Project</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script type="module" src="/src/js/admin-project-edit.js"></script>
</body>
</html>
