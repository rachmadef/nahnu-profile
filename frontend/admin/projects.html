<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kelola Project — NAHNU Admin</title>
  <link rel="icon" type="image/png" href="/logo-primary.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/css/style.css">
</head>
<body class="bg-[#0d0f14] text-slate-200 min-h-screen flex selection:bg-[#ff6b00] selection:text-white">
  <div id="admin-sidebar-container"></div>

  <main class="flex-1 ml-64 p-8 overflow-y-auto min-h-screen bg-[#0d0f14]">
    <div class="max-w-7xl mx-auto space-y-6">
      <!-- Header -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-6 border-b border-white/[0.08]">
        <div>
          <h1 class="text-2xl font-extrabold text-white tracking-tight">Manajemen Portofolio Project</h1>
          <p class="text-xs text-slate-400 mt-1">Daftar seluruh proyek yang dikerjakan oleh tim NAHNU.</p>
        </div>
        <a href="/admin/project-create.html" class="px-4 py-2.5 rounded-xl bg-gradient-to-r from-[#ff6b00] to-[#ff7a18] hover:from-[#ff7a18] hover:to-[#ff8a2e] text-white font-bold text-xs flex items-center gap-2 shadow-lg shadow-[#ff6b00]/25 transition-all uppercase tracking-wider">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
          <span>Buat Project Baru</span>
        </a>
      </div>

      <!-- Filters & Search -->
      <div class="glass-card p-4 rounded-2xl flex flex-wrap items-center justify-between gap-4 border border-white/[0.08]">
        <div class="flex flex-wrap items-center gap-3">
          <select id="filter-status" class="bg-[#11131c] border border-white/[0.1] rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-[#ff6b00]">
            <option value="">Semua Status</option>
            <option value="published">Published</option>
            <option value="draft">Draft</option>
          </select>
          <select id="filter-category" class="bg-[#11131c] border border-white/[0.1] rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-[#ff6b00]">
            <option value="">Semua Kategori</option>
          </select>
        </div>
        <div class="relative w-full sm:w-64">
          <input 
            type="text" 
            id="search-input" 
            placeholder="Cari judul..." 
            class="w-full bg-[#11131c] border border-white/[0.1] rounded-xl px-3 py-2 pl-9 text-xs text-white placeholder:text-slate-500 focus:outline-none focus:border-[#ff6b00]"
          >
          <svg class="w-3.5 h-3.5 text-slate-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </div>
      </div>

      <!-- Table Container -->
      <div class="glass-card rounded-2xl overflow-hidden border border-white/[0.08]">
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs">
            <thead class="bg-[#12141c] text-slate-300 uppercase tracking-wider font-bold border-b border-white/[0.08]">
              <tr>
                <th class="p-4">Project</th>
                <th class="p-4">Kategori</th>
                <th class="p-4">Teknologi</th>
                <th class="p-4">Developer</th>
                <th class="p-4">Status</th>
                <th class="p-4 text-right">Aksi</th>
              </tr>
            </thead>
            <tbody id="projects-table-body" class="divide-y divide-white/[0.06]">
              <tr>
                <td colspan="6" class="p-8 text-center text-slate-400">Memuat data project...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="/src/js/admin-projects.js"></script>
</body>
</html>
